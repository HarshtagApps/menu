<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title id="pageTitle">Harshtag Apps</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/order_items.css">
    <link rel="stylesheet" href="../css/scrollbar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
    <style>
        #snackbar {
            visibility: hidden;
            min-width: 90%;
            background-color: #00A9FE;
            color: #FFFFFF;
            text-align: left;
            border-radius: 12px;
            padding: 14px 18px;
            position: fixed;
            z-index: 9999;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Afacad', sans-serif;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
        }

        #snackbar.show {
            visibility: visible;
            animation: slideDown 0.35s ease-out,
                fadeOut 0.35s ease-in 4.65s;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translate(-50%, -20px);
            }

            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
                transform: translate(-50%, 0);
            }

            to {
                opacity: 0;
                transform: translate(-50%, -20px);
                visibility: hidden;
            }
        }
    </style>
</head>

<body>
    <div class="secondary-appbar">
        <div class="appbar-content">
            <button class="back-button" onclick="history.back()">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
            <div class="appbar-title" id="categoryTitle">Category</div>
        </div>
        <div class="appbar-border"></div>
    </div>

    <div class="items-container" id="itemsContainer">
    </div>
    <div id="snackbar"></div>

    <div class="category-summary-bar" id="categorySummaryBar">
        <div class="summary-info" id="summaryInfo" style="display: none;">
            <span id="categoryItemCount">0 Items from Category</span>
            <span id="categorySubtotal">₹0.00</span>
        </div>
        <button class="done-btn" id="doneBtn">
            <span>Done</span>
            <span class="item-badge" id="itemBadge" style="display: none;">0</span>
        </button>
    </div>

    <script type="module">
        import { loadRestaurantData } from '../js/api.js';
        import { getImageForCategory } from '../js/menu_data.js';
        import { initSecurity } from '../js/security.js';
        initSecurity();
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('r');
        const categoryType = urlParams.get('category');

        let restaurantData = null;
        let categoryItems = [];
        let orderItems = {};

        async function init() {
            try {
                if (!restaurantId || !categoryType) {
                    alert('Invalid URL parameters');
                    return;
                }

                document.getElementById('categoryTitle').textContent = categoryType;
                restaurantData = await loadRestaurantData(restaurantId);
                if (restaurantData && restaurantData.restoDetails) {
                    const restoName = (restaurantData.restoDetails.restoName || '').toUpperCase();
                    const pageTitle = document.getElementById('pageTitle');
                    pageTitle.textContent = restoName
                        ? `${restoName} | Harshtag Apps`
                        : 'Harshtag Apps';
                }

                const category = restaurantData.categories.find(cat => cat.categoryType === categoryType);
                if (category && category.items) {
                    categoryItems = category.items;
                }

                loadOrderState();
                renderItems();
                setupEventListeners();
                updateUI();

            } catch (error) {
                console.error('Error loading items:', error);
                alert('Failed to load items');
            }
        }

        function renderItems() {
            const container = document.getElementById('itemsContainer');
            const categoryImage = getImageForCategory(categoryType);

            if (categoryItems.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div class="empty-text">No items in this category</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = categoryItems.map(item => {
                const itemId = item.name;
                const itemName = item.name || 'Unknown';
                const prices = item.prices || {};
                const isVeg = item.isVeg !== undefined ? item.isVeg : true;
                const priceEntries = Object.entries(prices);
                const restoName = restaurantData?.restoDetails?.restoName || 'Our Restaurant';
                const safeRestoName = (restoName || '').replace(/'/g, "\\'");

                return `
                    <div class="food-item premium-item" ${item.isSpecial ? `onclick="showSpecialSnackbar('${safeRestoName}')"` : ''}>
                        <div class="item-header">
                            <div class="item-image-container">
                                ${categoryImage
                        ? `<img src="../${categoryImage}" alt="${itemName}" class="item-image">`
                        : '<div class="item-icon">🍽️</div>'
                    }
                            </div>
                            <div class="item-name">${itemName}</div>
                            <div class="item-indicators">
                                ${item.isSpecial ? `<img src="../assets/images/special.png" alt="Special" class="special-badge">` : ''}
                                <div class="veg-dot ${isVeg ? 'veg' : 'non-veg'}"></div>
                            </div>
                        </div>
                        <div class="price-variants">
                            ${priceEntries.map(([size, price]) => {
                        const key = `${itemId}_${size}`;
                        return `
<div class="price-variant-container" id="container-${key}">

    <!-- TOP ROW (unchanged layout) -->
    <div class="variant-row">
        <div class="variant-info">
            <div class="variant-size">${getSizeLabel(size)}</div>
            <div class="variant-price">₹ ${price}</div>
        </div>

        <div class="quantity-controls">
            <button class="qty-btn minus"
                data-item-id="${itemId}"
                data-size="${size}"
                data-price="${price}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 12h14"/>
                </svg>
            </button>

            <div class="quantity-display" id="qty-${key}">0</div>

            <button class="qty-btn plus"
                data-item-id="${itemId}"
                data-size="${size}"
                data-price="${price}">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- NOTES (inside, but below) -->
    <div class="notes-container" id="notes-${key}" style="display: none;">
        <input type="text"
               class="notes-input"
               placeholder="Add notes (extra spicy, no onions...)"
               data-item-id="${itemId}"
               data-size="${size}">
    </div>

</div>

`;
                    }).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            addQuantityListeners();
            addNotesListeners();
        }

        function getSizeLabel(size) {
            const labels = {
                'full': 'Full',
                'half': 'Half',
                'quarter': 'Quarter',
                'small': 'Small',
                'medium': 'Medium',
                'large': 'Large'
            };
            return labels[size.toLowerCase()] || size;
        }

        function addQuantityListeners() {
            document.querySelectorAll('.qty-btn.plus').forEach(btn => {
                btn.addEventListener('click', () => {
                    const itemId = btn.dataset.itemId;
                    const size = btn.dataset.size;
                    const price = parseFloat(btn.dataset.price);
                    updateQuantity(itemId, size, price, 1);
                });
            });

            document.querySelectorAll('.qty-btn.minus').forEach(btn => {
                btn.addEventListener('click', () => {
                    const itemId = btn.dataset.itemId;
                    const size = btn.dataset.size;
                    const price = parseFloat(btn.dataset.price);
                    updateQuantity(itemId, size, price, -1);
                });
            });
        }

        function addNotesListeners() {
            document.querySelectorAll('.notes-input').forEach(input => {
                const itemId = input.dataset.itemId;
                const size = input.dataset.size;

                if (orderItems[itemId] && orderItems[itemId][size]) {
                    input.value = orderItems[itemId][size].notes || '';
                }

                input.addEventListener('input', (e) => {
                    updateNotes(itemId, size, e.target.value);
                });
            });
        }

        function updateQuantity(itemId, size, price, change) {
            if (!orderItems[itemId]) {
                orderItems[itemId] = {};
            }
            if (!orderItems[itemId][size]) {
                orderItems[itemId][size] = { quantity: 0, price: price, notes: '' };
            }

            const newQty = orderItems[itemId][size].quantity + change;

            if (newQty <= 0) {
                delete orderItems[itemId][size];
                if (Object.keys(orderItems[itemId]).length === 0) {
                    delete orderItems[itemId];
                }
            } else {
                orderItems[itemId][size].quantity = newQty;
                orderItems[itemId][size].price = price;
            }

            saveOrderState();
            updateUI();
        }

        function updateNotes(itemId, size, notes) {
            if (orderItems[itemId] && orderItems[itemId][size]) {
                orderItems[itemId][size].notes = notes.trim();
                saveOrderState();
            }
        }

        function setupEventListeners() {
            const doneBtn = document.getElementById('doneBtn');
            doneBtn.addEventListener('click', () => {
                saveOrderState();
                window.location.href = `order.html?r=${restaurantId}`;
            });
        }

        function loadOrderState() {
            const saved = sessionStorage.getItem('orderState');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.restaurantId === restaurantId) {
                    orderItems = state.orderItems || {};
                }
            }
        }

        function saveOrderState() {
            const saved = sessionStorage.getItem('orderState');
            let state = {};
            if (saved) {
                state = JSON.parse(saved);
            }
            state.orderItems = orderItems;
            state.restaurantId = restaurantId;
            sessionStorage.setItem('orderState', JSON.stringify(state));
        }

        function updateUI() {
            const categoryItemCount = getCategoryItemCount();
            const categorySubtotal = calculateCategorySubtotal();

            categoryItems.forEach(item => {
                const itemId = item.name;
                const prices = item.prices || {};

                Object.keys(prices).forEach(size => {
                    const key = `${itemId}_${size}`;
                    const quantity = getQuantity(itemId, size);

                    const qtyElement = document.getElementById(`qty-${key}`);
                    if (qtyElement) {
                        qtyElement.textContent = quantity;
                    }

                    const container = document.getElementById(`container-${key}`);
                    if (container) {
                        if (quantity > 0) {
                            container.classList.add('has-quantity');
                        } else {
                            container.classList.remove('has-quantity');
                        }
                    }

                    const notesContainer = document.getElementById(`notes-${key}`);
                    if (notesContainer) {
                        notesContainer.style.display = quantity > 0 ? 'block' : 'none';
                    }
                });
            });

            const summaryInfo = document.getElementById('summaryInfo');
            const itemBadge = document.getElementById('itemBadge');
            const categoryItemCountEl = document.getElementById('categoryItemCount');
            const categorySubtotalEl = document.getElementById('categorySubtotal');

            if (categoryItemCount > 0) {
                summaryInfo.style.display = 'flex';
                itemBadge.style.display = 'inline-flex';
                itemBadge.textContent = categoryItemCount;
                categoryItemCountEl.textContent = `${categoryItemCount} Item${categoryItemCount > 1 ? 's' : ''} from ${categoryType}`;
                categorySubtotalEl.textContent = `₹${categorySubtotal.toFixed(2)}`;
            } else {
                summaryInfo.style.display = 'none';
                itemBadge.style.display = 'none';
            }
        }

        function getQuantity(itemId, size) {
            if (!orderItems[itemId] || !orderItems[itemId][size]) return 0;
            return orderItems[itemId][size].quantity || 0;
        }

        function getCategoryItemCount() {
            let count = 0;
            categoryItems.forEach(item => {
                const itemId = item.name;
                if (orderItems[itemId]) {
                    Object.values(orderItems[itemId]).forEach(sizeData => {
                        count += sizeData.quantity || 0;
                    });
                }
            });
            return count;
        }

        function calculateCategorySubtotal() {
            let subtotal = 0;
            categoryItems.forEach(item => {
                const itemId = item.name;
                if (orderItems[itemId]) {
                    Object.values(orderItems[itemId]).forEach(sizeData => {
                        const quantity = sizeData.quantity || 0;
                        const price = sizeData.price || 0;
                        subtotal += quantity * price;
                    });
                }
            });
            return subtotal;
        }
        init();
    </script>

    <script>
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });

        function showSpecialSnackbar(restoName) {
            const snackbar = document.getElementById("snackbar");
            snackbar.innerHTML = `<strong>${restoName} Special 👑</strong><br>This is one of the special items of our restaurant.`;
            snackbar.className = "show";
            if (window.snackbarTimeout) {
                clearTimeout(window.snackbarTimeout);
            }
            window.snackbarTimeout = setTimeout(() => {
                snackbar.className = "";
            }, 5000);
        }
    </script>
</body>

</html>
