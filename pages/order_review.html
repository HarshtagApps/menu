<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title id="pageTitle">Harshtag Apps</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/order_review.css">
    <link rel="stylesheet" href="../css/scrollbar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="secondary-appbar">
        <div class="appbar-content">
            <button class="back-button" onclick="history.back()">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
            <div class="appbar-title">Review Order</div>
            <button class="edit-button" onclick="history.back()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z" />
                </svg>
            </button>
        </div>
        <div class="appbar-border"></div>
    </div>

    <div class="review-container">
        <div class="customer-details-card">
            <div class="card-title">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 12c2.2 0 4-1.8 4-4s-1.8-4-4-4-4 1.8-4 4 1.8 4 4 4z" />
                    <path d="M12 14c-4.4 0-8 2.2-8 5v1h16v-1c0-2.8-3.6-5-8-5z" />
                </svg>
                <span>Customer Details</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Name</span>
                <span class="detail-value" id="customerName">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Address</span>
                <span class="detail-value" id="customerAddress">-</span>
            </div>
            <div class="detail-row">
                <span class="detail-label">Type</span>
                <span class="detail-value">Delivery</span>
            </div>
        </div>

        <div class="order-items-section">
            <div class="section-header">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18"></rect>
                    <line x1="5" y1="7" x2="19" y2="7"></line>
                    <line x1="5" y1="11" x2="14" y2="11"></line>
                    <line x1="5" y1="15" x2="19" y2="15"></line>
                    <line x1="5" y1="19" x2="14" y2="19"></line>
                </svg>

                <span id="orderItemsTitle">Order Items (0)</span>
            </div>
            <div class="items-list" id="itemsList">
            </div>
        </div>
    </div>

    <div class="order-summary-bar">
        <div class="total-section">
            <div class="total-label">Total Amount</div>
            <div class="total-amount" id="totalAmount">₹0.00</div>
        </div>
        <button class="send-confirmation-btn" id="sendConfirmationBtn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9 12l2 2 4-4"></path>
            </svg>
            <span>Send Confirmation</span>
        </button>
    </div>

    <script type="module">
        import { loadRestaurantData } from '../js/api.js';
        import { initSecurity } from '../js/security.js';
        initSecurity();
        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('r');

        let restaurantData = null;
        let orderState = null;

        async function init() {
            try {
                if (!restaurantId) {
                    alert('No restaurant specified');
                    return;
                }

                restaurantData = await loadRestaurantData(restaurantId);
                if (restaurantData && restaurantData.restoDetails) {
                    const restoName = (restaurantData.restoDetails.restoName || '').toUpperCase();
                    const pageTitle = document.getElementById('pageTitle');
                    pageTitle.textContent = restoName
                        ? `${restoName} | Harshtag Apps`
                        : 'Harshtag Apps';
                }

                const saved = sessionStorage.getItem('orderState');
                if (!saved) {
                    alert('No order data found');
                    window.location.href = `order.html?r=${restaurantId}`;
                    return;
                }
                orderState = JSON.parse(saved);
                renderOrderReview();
                setupEventListeners();

            } catch (error) {
                console.error('Error loading review page:', error);
                alert('Failed to load order details');
            }
        }

        function renderOrderReview() {
            document.getElementById('customerName').textContent = orderState.customerName || '-';
            document.getElementById('customerAddress').textContent = orderState.customerAddress || '-';

            const finalItems = prepareFinalOrderData();
            const itemCount = getTotalItemsCount();
            const totalAmount = calculateTotalAmount();

            document.getElementById('orderItemsTitle').textContent = `Order Items (${itemCount})`;
            document.getElementById('totalAmount').textContent = `₹${totalAmount.toFixed(2)}`;

            const itemsList = document.getElementById('itemsList');

            if (finalItems.length === 0) {
                itemsList.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div class="empty-text">No items in order</div>
                    </div>
                `;
                return;
            }

            itemsList.innerHTML = finalItems.map(item => {
                const vegIcon = item.isVeg
                    ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="#00C851"><rect x="2" y="2" width="20" height="20" rx="2"/></svg>'
                    : '<svg width="14" height="14" viewBox="0 0 24 24" fill="#FF4444"><rect x="2" y="2" width="20" height="20" rx="2"/></svg>';

                return `
                    <div class="item-card">
                        <div class="item-header">
                            <div class="item-name-row">
                                ${vegIcon}
                                <span class="item-name">${item.name}</span>
                            </div>
                            <span class="item-total">₹${item.itemTotal.toFixed(0)}</span>
                        </div>
                        <div class="item-details">
                            <span class="item-size-qty">${formatSize(item.size)} • Qty: ${item.quantity}</span>
                            <span class="item-calculation">${item.quantity} × ₹${item.price.toFixed(0)}</span>
                        </div>
                        ${item.notes ? `
                            <div class="item-notes">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <path d="M14 2v6h6"></path>
                                    <line x1="16" y1="13" x2="8" y2="13"></line>
                                    <line x1="16" y1="17" x2="8" y2="17"></line>
                                    <line x1="10" y1="9" x2="8" y2="9"></line>
                                </svg>
                                <span>${item.notes}</span>
                            </div>
                        ` : ''}
                    </div>
                `;
            }).join('');
        }

        function prepareFinalOrderData() {
            const finalItems = [];
            const orderItems = orderState.orderItems || {};
            restaurantData.categories.forEach(category => {
                if (category.items) {
                    category.items.forEach(menuItem => {
                        const itemId = menuItem.name;
                        if (orderItems[itemId]) {
                            Object.entries(orderItems[itemId]).forEach(([size, sizeData]) => {
                                const quantity = sizeData.quantity || 0;
                                const price = sizeData.price || 0;
                                const notes = sizeData.notes || '';
                                const itemTotal = quantity * price;

                                finalItems.push({
                                    name: menuItem.name,
                                    categoryType: category.categoryType,
                                    size: size,
                                    quantity: quantity,
                                    price: price,
                                    itemTotal: itemTotal,
                                    notes: notes,
                                    isVeg: menuItem.isVeg !== undefined ? menuItem.isVeg : true
                                });
                            });
                        }
                    });
                }
            });

            return finalItems;
        }

        function getTotalItemsCount() {
            let count = 0;
            const orderItems = orderState.orderItems || {};
            Object.values(orderItems).forEach(item => {
                Object.values(item).forEach(sizeData => {
                    count += sizeData.quantity || 0;
                });
            });
            return count;
        }

        function calculateTotalAmount() {
            let total = 0;
            const orderItems = orderState.orderItems || {};
            Object.values(orderItems).forEach(item => {
                Object.values(item).forEach(sizeData => {
                    const quantity = sizeData.quantity || 0;
                    const price = sizeData.price || 0;
                    total += quantity * price;
                });
            });
            return total;
        }

        function formatSize(size) {
            switch (size.toLowerCase()) {
                case 'small': return 'Small';
                case 'medium': return 'Medium';
                case 'large': return 'Large';
                case 'half': return 'Half';
                case 'full': return 'Full';
                default: return size;
            }
        }

        function generateWhatsAppMessage() {
            const restoName = restaurantData?.restoDetails?.restoName || 'Restaurant';
            const finalItems = prepareFinalOrderData();
            const totalAmount = calculateTotalAmount();

            let message = `*🍽️ New Order*\n\n`;
            message += `_Hi ${restoName},_\n`;
            message += `_I would like to place an order:_\n\n`;

            message += `👤*_Customer Details :_*\n`;
            message += `_*Name:* ${orderState.customerName}_\n`;
            message += `_*Address:* ${orderState.customerAddress}_\n\n`;

            message += `🍴*_Ordered Items:_*\n`;
            finalItems.forEach((item, index) => {
                const vegSymbol = item.isVeg ? '🟩' : '🟥';
                const sizeInfo = item.size ? `${formatSize(item.size)} × ${item.quantity}` : `${item.quantity}`;
                message += `_*${index + 1})* ${vegSymbol} ${item.name}_\n`;
                message += `_${sizeInfo} = ₹${item.itemTotal}_\n`;
                if (item.notes) {
                    message += `_Note: ${item.notes}_\n`;
                }
                message += `\n`;
            });

            message += `💸_*Total Amount:* ₹${totalAmount.toFixed(2)}_\n\n`;
            message += `_Please confirm. Thanks!_\n`;
            message += `_Powered by *HARSHTAG APPS*_`;

            return encodeURIComponent(message);
        }

        function setupEventListeners() {
            const sendBtn = document.getElementById('sendConfirmationBtn');

            sendBtn.addEventListener('click', async () => {
                if (!orderState.customerName || orderState.customerName.trim().length === 0) {
                    alert('Please enter customer name');
                    return;
                }
                if (!orderState.customerAddress || orderState.customerAddress.trim().length === 0) {
                    alert('Please enter customer address');
                    return;
                }
                if (!orderState.orderItems || Object.keys(orderState.orderItems).length === 0) {
                    alert('Please add items to the order');
                    return;
                }
                sendBtn.disabled = true;
                sendBtn.innerHTML = `
                    <div class="spinner"></div>
                    <span>Sending...</span>
                `;

                try {
                    const phoneNumber = restaurantData?.restoDetails?.contact || '';

                    if (!phoneNumber) {
                        alert('Restaurant contact number not found');
                        sendBtn.disabled = false;
                        sendBtn.innerHTML = `
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M9 12l2 2 4-4"></path>
                            </svg>
                            <span>Send Confirmation</span>
                        `;
                        return;
                    }

                    const message = generateWhatsAppMessage();
                    const whatsappURL = `https://api.whatsapp.com/send?phone=91${phoneNumber}&text=${message}`;
                    console.log('WhatsApp URL:', whatsappURL);
                    console.log('Phone Number:', phoneNumber);
                    await new Promise(resolve => setTimeout(resolve, 500));
                    window.open(whatsappURL, '_blank');
                    setTimeout(() => {
                        sessionStorage.removeItem('orderState');
                        window.location.href = `menu.html?r=${restaurantId}`;
                    }, 1000);

                } catch (error) {
                    console.error('Error sending confirmation:', error);
                    alert('Failed to send confirmation');
                    sendBtn.disabled = false;
                    sendBtn.innerHTML = `
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M9 12l2 2 4-4"></path>
                        </svg>
                        <span>Send Confirmation</span>
                    `;
                }
            });
        }
        init();
    </script>

    <script>
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>

</html>
