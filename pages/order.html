<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title id="pageTitle">Harshtag Apps</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/order.css">
    <link rel="stylesheet" href="../css/scrollbar.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Afacad:ital,wght@0,400..700;1,400..700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="secondary-appbar">
        <div class="appbar-content">
            <button class="back-button" onclick="history.back()">
                <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" />
                </svg>
            </button>
            <div class="appbar-title">Your Order</div>
        </div>
        <div class="appbar-border"></div>
    </div>

    <div class="order-container">
        <div class="customer-section">

            <div class="input-group">
                <label class="input-label">Customer Name</label>
                <input type="text" id="customerName" class="input-field" placeholder="Enter customer name"
                    autocapitalize="words">
            </div>

            <div class="input-group">
                <label class="input-label">Delivery Address</label>
                <textarea id="customerAddress" class="input-field textarea-field" placeholder="Enter delivery address"
                    rows="3" autocapitalize="sentences"></textarea>
            </div>
        </div>

        <div class="menu-section">
            <div style="
    font-size: 16px;
    font-weight: 600;
    color: var(--primary-color);
    border-bottom: 1px solid #e0e0e0;
    margin-bottom: 12px;
">
                Menu
            </div>

            <div class="categories-grid" id="categoriesGrid">
            </div>
        </div>
    </div>

    <div class="order-summary-bar" id="orderSummaryBar" style="display: none;">
        <div class="summary-left">
            <div class="summary-items" id="summaryItems">0 Items Added</div>
            <div class="summary-total" id="summaryTotal">₹0.00</div>
        </div>
        <button class="review-order-btn" id="reviewOrderBtn">
            <span>Review Order</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18l6-6-6-6"></path>
            </svg>
        </button>
    </div>

    <script type="module">
        import { loadRestaurantData } from '../js/api.js';
        import { getImageForCategory } from '../js/menu_data.js';
        import { initSecurity } from '../js/security.js';
        initSecurity();

        const urlParams = new URLSearchParams(window.location.search);
        const restaurantId = urlParams.get('r');

        let customerName = '';
        let customerAddress = '';
        let orderItems = {};
        let restaurantData = null;
        async function init() {
            try {
                if (!restaurantId) {
                    alert('No restaurant specified');
                    return;
                }

                restaurantData = await loadRestaurantData(restaurantId);
                if (restaurantData && restaurantData.restoDetails) {
                    const restoName = (restaurantData.restoDetails.restoName || '').toUpperCase();
                    const pageTitle = document.getElementById('pageTitle');
                    pageTitle.textContent = restoName
                        ? `${restoName} | Harshtag Apps`
                        : 'Harshtag Apps';
                }
                renderCategories();
                setupEventListeners();

            } catch (error) {
                console.error('Error loading order page:', error);
                alert('Failed to load restaurant data');
            }
        }

        function renderCategories() {
            const categories = restaurantData.categories || [];
            const uniqueCategories = [...new Set(categories.map(cat => cat.categoryType))];
            const grid = document.getElementById('categoriesGrid');

            if (uniqueCategories.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🍽️</div>
                        <div class="empty-text">No menu items available</div>
                    </div>
                `;
                return;
            }

            grid.innerHTML = uniqueCategories.map(category => {
                const image = getImageForCategory(category);
                const hasItems = categoryHasItems(category);

                return `
                    <div class="category-card" data-category="${category}">
                        <div class="category-image-container">
                            ${image ?
                        `<img src="../${image}" alt="${category}" class="category-image">` :
                        '<div class="category-icon">🍽️</div>'
                    }
                        </div>
                        <div class="category-name">${category}</div>
                        ${hasItems ? '<div class="category-indicator"></div>' : ''}
                    </div>
                `;
            }).join('');
            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', () => {
                    const category = card.dataset.category;
                    saveOrderState();
                    window.location.href = `order_items.html?r=${restaurantId}&category=${encodeURIComponent(category)}`;
                });
            });
        }

        function categoryHasItems(categoryType) {
            const categoryData = restaurantData.categories.find(cat => cat.categoryType === categoryType);
            if (!categoryData || !categoryData.items) return false;

            return categoryData.items.some(item => {
                const itemId = item.name;
                return orderItems[itemId] && Object.keys(orderItems[itemId]).length > 0;
            });
        }

        function setupEventListeners() {
            const customerNameInput = document.getElementById('customerName');
            const customerAddressInput = document.getElementById('customerAddress');
            const reviewBtn = document.getElementById('reviewOrderBtn');
            loadOrderState();

            customerNameInput.addEventListener('input', (e) => {
                customerName = e.target.value;
                saveOrderState();
            });

            customerAddressInput.addEventListener('input', (e) => {
                customerAddress = e.target.value;
                saveOrderState();
            });

            reviewBtn.addEventListener('click', () => {
                if (!validateOrder()) {
                    return;
                }
                saveOrderState();
                window.location.href = `order_review.html?r=${restaurantId}`;
            });
        }

        function validateOrder() {
            if (!customerName || customerName.trim().length === 0) {
                alert('Please enter customer name');
                return false;
            }
            if (!customerAddress || customerAddress.trim().length === 0) {
                alert('Please enter customer address');
                return false;
            }
            if (Object.keys(orderItems).length === 0) {
                alert('Please add items to the order');
                return false;
            }
            return true;
        }

        function saveOrderState() {
            const state = {
                customerName: customerName,
                customerAddress: customerAddress,
                orderItems: orderItems,
                restaurantId: restaurantId
            };
            sessionStorage.setItem('orderState', JSON.stringify(state));
        }

        function loadOrderState() {
            const saved = sessionStorage.getItem('orderState');
            if (saved) {
                const state = JSON.parse(saved);
                if (state.restaurantId === restaurantId) {
                    customerName = state.customerName || '';
                    customerAddress = state.customerAddress || '';
                    orderItems = state.orderItems || {};

                    document.getElementById('customerName').value = customerName;
                    document.getElementById('customerAddress').value = customerAddress;

                    updateUI();
                }
            }
        }

        function updateUI() {
            const itemCount = getTotalItemsCount();
            const totalAmount = calculateTotalAmount();
            const summaryBar = document.getElementById('orderSummaryBar');
            const summaryItems = document.getElementById('summaryItems');
            const summaryTotal = document.getElementById('summaryTotal');

            if (itemCount > 0) {
                summaryBar.style.display = 'flex';
                summaryItems.textContent = `${itemCount} Item${itemCount > 1 ? 's' : ''} Added`;
                summaryTotal.textContent = `₹${totalAmount.toFixed(2)}`;
            } else {
                summaryBar.style.display = 'none';
            }
            renderCategories();
        }

        function getTotalItemsCount() {
            let count = 0;
            Object.values(orderItems).forEach(item => {
                Object.values(item).forEach(sizeData => {
                    count += sizeData.quantity || 0;
                });
            });
            return count;
        }

        function calculateTotalAmount() {
            let total = 0;
            Object.entries(orderItems).forEach(([itemId, sizes]) => {
                Object.entries(sizes).forEach(([size, sizeData]) => {
                    const quantity = sizeData.quantity || 0;
                    const price = sizeData.price || 0;
                    total += quantity * price;
                });
            });
            return total;
        }
        window.addEventListener('storage', (e) => {
            if (e.key === 'orderState') {
                loadOrderState();
            }
        });

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                loadOrderState();
            }
        });
        init();
    </script>

    <script>
        document.addEventListener('contextmenu', function (e) {
            e.preventDefault();
            return false;
        });
    </script>
</body>

</html>
